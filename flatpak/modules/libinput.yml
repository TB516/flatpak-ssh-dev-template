name: libinput
buildsystem: meson
config-opts:
  - -Dlibwacom=false
  - -Dmtdev=false
  - -Ddebug-gui=false
  - -Dtests=false
  - -Ddocumentation=false
  - -Dlua-plugins=disabled
  - -Dzshcompletiondir=no
cleanup:
  - /bin
  - /include
  - /libexec
  - /lib/pkgconfig
  - /lib/udev
  - /share/libinput
  - /share/man
sources:
  - type: archive
    url: https://gitlab.freedesktop.org/libinput/libinput/-/archive/1.31.3/libinput-1.31.3.tar.gz
    sha256: b6749bf6f1890f6631c0a70a027c35fec9d2e096a39f720548896e41474a9854
