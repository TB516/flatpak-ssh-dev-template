name: libcap-ng
buildsystem: autotools
config-opts:
  - --without-python3
  - --disable-static
  - --disable-cap-audit
cleanup:
  - /bin
  - /include
  - /lib/pkgconfig
  - /lib/*.la
  - /lib/libdrop_ambient*
  - /share/aclocal
  - /share/bash-completion
  - /share/man
sources:
  - type: archive
    url: https://github.com/stevegrubb/libcap-ng/archive/refs/tags/v0.9.3.tar.gz
    sha256: fe11ebbb55904763b3532f19069f13ec319042634620180a03bd4653d301563e
