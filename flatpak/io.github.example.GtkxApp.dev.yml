id: io.github.example.GtkxApp
runtime: org.gnome.Sdk
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node24
command: /app/sbin/sshd
appstream-compose: false

finish-args:
  - --allow=devel
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --env=PATH=/app/bin:/usr/lib/sdk/node24/bin:/usr/bin

modules:
  - modules/openssh.yml
  - modules/dev-environment.yml
  - modules/libcap-ng.yml
  - modules/util-linux-setpriv.yml
  - modules/libinput.yml
  - modules/weston.yml
  - modules/pnpm.yml
